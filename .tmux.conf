# Allow terminal graphics escape sequences (Kitty image protocol, used by
# image.nvim/molten.nvim for inline plot output) to pass through tmux.
set -g allow-passthrough on

# Vim-style navigation between split panes.
# tmux calls each split area a "pane"; a tmux "window" is the tab-like
# container that can hold one or more panes. These bindings are used after
# the prefix, which is currently Ctrl-b.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes with prefix + Shift-h/j/k/l.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Use Vim-style navigation in tmux copy mode.
setw -g mode-keys vi

# Use Vim-style editing when typing commands in tmux's command/status line.
set -g status-keys vi

# Vim-style selection bindings for copy mode.
bind-key -T copy-mode-vi v send-keys -X rectangle-off \; send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X rectangle-off \; send-keys -X select-line
bind-key -T copy-mode-vi Escape send-keys -X clear-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-on \; send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi p paste-buffer
bind-key -T copy-mode-vi i send-keys -X cancel
bind-key -T copy-mode-vi a send-keys -X cancel

# Enter copy mode with prefix + Escape.
bind-key -T prefix Escape copy-mode
